name: Deploy Staging to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sanitized public site
        env:
          APP_MODE: ${{ vars.APP_MODE || 'read_only' }}
          APP_RELEASE: pages-${{ github.sha }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          python scripts/build_public_private_release.py
          python scripts/validate_release.py
          python scripts/write_runtime_config.py
          python scripts/prepare_public_deploy.py
          python scripts/validate_static_site.py

      - name: Verify public allowlist
        run: |
          test ! -e .deploy-dist/salles_all_idf.geojson
          test ! -e .deploy-dist/import_queue.geojson
          test ! -e .deploy-dist/funnel_debug.json
          test ! -e .deploy-dist/venue_private_details.json
          test "$(find .deploy-dist -type f | wc -l)" -eq 6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .deploy-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
