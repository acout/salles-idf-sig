<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prospection salles IDF</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=20260619-quality1">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <header class="brand">
      <div>
        <h1>🏫 Salles IDF</h1>
        <p>Prospection · appels · candidatures · events</p>
      </div>
      <button class="icon-btn mobile-only" id="toggle-sidebar" aria-label="Masquer le panneau">×</button>
    </header>

    <section class="toolbar">
      <div class="view-tabs" role="tablist">
        <button class="active" id="map-tab" data-view="map">Carte</button>
        <button id="list-tab" data-view="list">Liste</button>
        <button id="pipeline-tab" data-view="pipeline">Pipeline</button>
      </div>
      <div class="metrics" id="metrics">—</div>
    </section>

    <section class="filters">
      <label class="field-label">Recherche</label>
      <input type="search" id="search" placeholder="Nom, ville, contact, notes…" class="input">

      <div class="grid-2">
        <div>
          <label class="field-label">Département</label>
          <select id="dept-filter" class="input">
            <option value="all">Tous</option>
            <option value="75">75 Paris</option>
            <option value="92">92</option>
            <option value="93">93</option>
            <option value="94">94</option>
            <option value="77">77</option>
            <option value="78">78</option>
            <option value="91">91</option>
            <option value="95">95</option>
          </select>
        </div>
        <div>
          <label class="field-label">Statut</label>
          <select id="status-filter" class="input">
            <option value="all">Tous</option>
            <option value="new">À qualifier</option>
            <option value="shortlist">Shortlist</option>
            <option value="contacted">Contactée</option>
            <option value="applied">Candidature envoyée</option>
            <option value="accepted">OK / utilisable</option>
            <option value="rejected">Refus / pas adaptée</option>
            <option value="used">Déjà utilisée</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label class="field-label">Capacité max <span id="cap-val">≤20</span></label>
          <input type="range" id="cap-max" min="5" max="100" value="20" class="slider">
        </div>
        <div>
          <label class="field-label">Tri</label>
          <select id="sort-by" class="input">
            <option value="fit">Meilleur fit</option>
            <option value="quality">Qualité données</option>
            <option value="status">Statut</option>
            <option value="nextAction">Prochaine action</option>
            <option value="city">Ville</option>
            <option value="capacity">Capacité</option>
          </select>
        </div>
      </div>

      <label class="field-label">Qualité données</label>
      <select id="quality-filter" class="input">
        <option value="all">Toutes</option>
        <option value="any">À vérifier</option>
        <option value="contact_missing">Contact manquant</option>
        <option value="price_missing">Prix manquant</option>
        <option value="capacity_uncertain">Capacité à vérifier</option>
        <option value="duplicate_suspect">Doublon probable</option>
        <option value="geocode_suspect">Géocodage douteux</option>
      </select>
    </section>

    <section class="quick-actions">
      <button id="export-json" class="secondary-btn">Exporter suivi</button>
      <label class="secondary-btn file-label">Importer<input type="file" id="import-json" accept="application/json" hidden></label>
    </section>

    <section class="list-panel" id="list-panel" aria-live="polite"></section>
  </aside>

  <main class="main">
    <button class="floating-menu mobile-only" id="open-sidebar">☰ Filtres</button>
    <div id="map" class="map-view"></div>
    <section id="table-view" class="table-view hidden">
      <div class="table-header">
        <h2>Vue liste des salles</h2>
        <p>Classement opérationnel pour prospecter, relancer et documenter.</p>
      </div>
      <div id="venue-table" class="venue-table"></div>
    </section>
    <section id="pipeline-view" class="pipeline-view hidden">
      <div class="table-header">
        <h2>Pipeline de prospection</h2>
        <p>Avance les salles par statut, puis ouvre la fiche pour notes, relances, appels et events.</p>
      </div>
      <div id="pipeline-board" class="pipeline-board"></div>
    </section>
  </main>

  <aside class="detail-panel hidden" id="detail-panel">
    <button class="icon-btn close-detail" id="close-detail" aria-label="Fermer la fiche">×</button>
    <div id="detail-content"></div>
  </aside>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js?v=20260619-quality1"></script>
</body>
</html>
