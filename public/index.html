<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petites salles IDF — Carte des salles ≤20 pers, budget abordable</title>
<meta name="description" content="Carte interactive des petites salles privatisables en Île-de-France (≤20 personnes, budget abordable). Filtres par département, catégorie, prix.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map"></div>

<aside class="panel" id="panel">
  <header class="panel-header">
    <h1>🟥 Petites salles IDF</h1>
    <p class="subtitle">≤20 pers · budget abordable · Île-de-France</p>
    <div id="count" class="count"></div>
  </header>

  <section class="filters">
    <h2>Département</h2>
    <div class="filter-row" id="dept-filters">
      <button class="active" data-dept="all">Tous</button>
      <button data-dept="75">75</button>
      <button data-dept="92">92</button>
      <button data-dept="93">93</button>
      <button data-dept="94">94</button>
      <button data-dept="77">77</button>
      <button data-dept="78">78</button>
      <button data-dept="91">91</button>
      <button data-dept="95">95</button>
    </div>
  </section>

  <section class="filters">
    <h2>Catégorie</h2>
    <div class="filter-row" id="cat-filters">
      <button class="active" data-cat="all">Tous</button>
    </div>
  </section>

  <section class="filters">
    <h2>Prix <span id="price-label" class="price-label">min → max</span></h2>
    <div class="slider-row">
      <input type="range" id="price-min" min="0" max="100" value="0" class="slider" aria-label="Score prix minimum">
      <input type="range" id="price-max" min="0" max="100" value="100" class="slider" aria-label="Score prix maximum">
    </div>
  </section>

  <section class="filters">
    <h2>Taille <span id="cap-label" class="price-label">1–20 pers</span></h2>
    <div class="slider-row">
      <input type="range" id="cap-min" min="1" max="20" value="1" class="slider" aria-label="Capacité minimum">
      <input type="range" id="cap-max" min="1" max="20" value="20" class="slider" aria-label="Capacité maximum">
    </div>
  </section>

  <footer class="panel-footer">
    <small>Couleur = fit score (vert = meilleur). Données web + géocodage BAN. À qualifier avant réservation.</small>
  </footer>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
